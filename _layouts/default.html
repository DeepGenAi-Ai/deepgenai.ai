<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }} — {{ site.tagline }}</title>
  {% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}
  {% seo title=false %}
  <link rel="icon" href="{{ '/assets/img/mark.png' | relative_url }}">
  <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="scroll-progress" id="scroll-progress"></div>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  {% include cookie-banner.html %}
  {% include analytics.html %}
  <button type="button" class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>
  <script src="{{ '/assets/js/effects.js' | relative_url }}" defer></script>
</body>
</html>
